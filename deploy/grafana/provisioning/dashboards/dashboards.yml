# Provisioned so the dashboard is present on first boot: a judge should not have
# to import JSON before seeing a graph.
apiVersion: 1

providers:
  - name: pdguard
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
